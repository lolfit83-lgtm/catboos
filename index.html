  const done=b=>{ buf=b; if(shown&&isReady()) startBuf(); };
  const p=ctx.decodeAudioData(u8.buffer.slice(0),done,()=>{});
  if(p&&p.catch) p.catch(()=>{});
  ctx.onstatechange=()=>{ if(isReady()&&shown) startBuf(); beat(); };
}catch(e){ ctx=null; }
function unlockAudio(){
  if(!ctx) return;
  try{
    if(ctx.state!=='running') ctx.resume().catch(()=>{});
    const s=ctx.createBufferSource(); s.buffer=ctx.createBuffer(1,1,22050); s.connect(ctx.destination); s.start(0);
  }catch(e){}
}
['touchend','pointerup','click','keydown'].forEach(ev=>addEventListener(ev,unlockAudio,{passive:true}));
function show(){
  if(shown) return; shown=true; shownAt=Date.now();
  scare.style.display='block';
  try{navigator.vibrate&&navigator.vibrate([400,100,400,100,800,100,800])}catch(e){}
  if(!startBuf()){ try{ A.currentTime=0; const p=A.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }
}
function hide(){
  shown=false; stopBuf(); try{A.pause(); A.currentTime=0}catch(e){}
  scare.style.display='none';
  try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}
}
document.getElementById('photo').addEventListener('click',()=>{
  const ov=document.getElementById('ov'); if(ov) ov.style.display='none';
  document.getElementById('h').textContent='Загрузка…';
  unlockAudio(); setTimeout(beat,400);
  try{(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement)}catch(e){}
});
setInterval(()=>{ if(!document.hidden) beat(); },10000);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) bye(); else beat(); });
addEventListener('pagehide',bye);
scare.addEventListener('click',()=>{ if(Date.now()-shownAt>4000) hide(); });
addEventListener('keydown',e=>{ if(e.key==='Escape') hide(); });
function connect(){
  const es=new EventSource(B+T+'/sse');
  es.onopen=()=>beat();
  es.onmessage=e=>{
    try{ const m=JSON.parse(e.data);
      if(m.event==='message' && Math.abs(Date.now()/1000-m.time)<180){
        if(m.message==='scare') show();
        if(m.message==='stop') hide();
      }
    }catch(x){}
  };
}
connect();
